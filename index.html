<!DOCTYPE html>
<html lang="en" class="theme-pastel">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Study Schedule Generator — Free Exam Planner</title>
  <meta name="description" content="Generate a personalized day-by-day study schedule for your exam. Set your exam date, daily study hours, and rest days. Export to PDF, Notion, or iCalendar." />
  <meta name="keywords" content="study schedule generator, exam planner, study plan, revision timetable, ical export" />
  <link rel="canonical" href="https://obair.github.io/study-schedule-generator/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Study Schedule Generator — Free Exam Planner" />
  <meta property="og:description" content="Generate a personalized day-by-day study schedule for your exam. Export to PDF, Notion, or iCalendar." />
  <meta property="og:url" content="https://obair.github.io/study-schedule-generator/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Study Schedule Generator" />
  <meta name="twitter:description" content="Free exam planner. Set your date, hours per day, and rest days — get a full study schedule instantly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Theme variables ──────────────────────────────────── */
    html.theme-pastel {
      --bg:         #fff1f5;
      --surface:    #ffffff;
      --text:       #3b1f2b;
      --text-muted: #9d6e7e;
      --accent:     #ec4899;
      --accent-fg:  #ffffff;
      --border:     #fbcfe8;
      --radius:     0.75rem;
      --shadow:     0 1px 3px rgba(236,72,153,.08), 0 1px 2px rgba(236,72,153,.05);
      --warn-bg:    #fff0f6;
      --warn-text:  #9d174d;
      --warn-border:#f9a8d4;
    }
    html.theme-dark {
      --bg:         #0f172a;
      --surface:    #1e293b;
      --text:       #e2e8f0;
      --text-muted: #94a3b8;
      --accent:     #2dd4bf;
      --accent-fg:  #0f172a;
      --border:     #334155;
      --radius:     0.5rem;
      --shadow:     0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
      --warn-bg:    #1c1917;
      --warn-text:  #fbbf24;
      --warn-border:#78350f;
    }

    /* ── Base ─────────────────────────────────────────────── */
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ── Card / Surface ───────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ── Form inputs ──────────────────────────────────────── */
    .field {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    label {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Primary button ───────────────────────────────────── */
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      padding: 0.65rem 1.75rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
      box-shadow: 0 1px 4px color-mix(in srgb, var(--accent) 35%, transparent);
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .btn-primary:active { opacity: 0.75; box-shadow: none; }

    /* ── Secondary button ─────────────────────────────────── */
    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 1.1rem;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.875rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-secondary:disabled { opacity: 0.5; cursor: default; }

    /* ── Theme buttons ────────────────────────────────────── */
    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .theme-btn:hover, .theme-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    /* ── Mode toggle (segmented control) ─────────────────── */
    .mode-toggle {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      border: none;
      border-radius: 999px;
      padding: 0.4rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.18s;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: 0 1px 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    /* ── Error banner ─────────────────────────────────────── */
    #errorMsg {
      background: color-mix(in srgb, #ef4444 12%, transparent);
      border: 1px solid #fca5a5;
      border-radius: var(--radius);
      color: #b91c1c;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
    }
    html.theme-dark #errorMsg { color: #fca5a5; }

    /* ── Warning banner ───────────────────────────────────── */
    .warning-banner {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: var(--radius);
      color: var(--warn-text);
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    /* ── Output title ────────────────────────────────────── */
    .output-title {
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .output-title-main {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .output-title-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* ── Schedule summary row ─────────────────────────────── */
    .schedule-summary {
      display: flex;
      gap: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .schedule-summary span { font-weight: 600; }

    /* ── Schedule table ───────────────────────────────────── */
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .schedule-table th {
      text-align: left;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .schedule-table td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .schedule-table tbody tr:last-child td { border-bottom: none; }
    .schedule-table tbody tr:hover {
      background: color-mix(in srgb, var(--accent) 5%, transparent);
    }

    /* ── Checkbox & Notes: screen only hidden, print only shown ── */
    .col-num  { width: 2rem; }
    .col-check, .col-notes { display: none; }

    .schedule-check {
      width: 1rem;
      height: 1rem;
      vertical-align: middle;
    }

    /* ── View toggle (output) ────────────────────────────── */
    .view-toggle {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
      margin-bottom: 0.75rem;
    }
    .view-btn {
      border: none;
      border-radius: 999px;
      padding: 0.25rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .view-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: 0 1px 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    /* ── Calendar table ───────────────────────────────────── */
    .cal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      table-layout: fixed;
    }
    .cal-table thead th {
      text-align: center;
      padding: 0.35rem 0.2rem;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--border);
    }
    .cal-week-label-header { width: 5.5rem; }
    .cal-week-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      padding: 0.45rem 0.4rem;
      text-align: right;
      vertical-align: middle;
      border-bottom: 1px solid var(--border);
    }
    .cal-cell {
      text-align: center;
      padding: 0.45rem 0.2rem;
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      line-height: 1.2;
    }
    .cal-study {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--text);
      font-weight: 700;
    }
    .cal-rest  { color: var(--text-muted); }
    .cal-free  { color: var(--border); font-size: 0.7rem; }
    .cal-empty { background: color-mix(in srgb, var(--border) 25%, transparent); }
    .cal-exam  { color: var(--accent); font-size: 0.75rem; }

    /* Calendar print-only elements hidden on screen */
    .cal-print-check { display: none; }
    .cal-notes-row   { display: none; }

    /* ── Print styles ─────────────────────────────────────── */
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .card { border: 1px solid #ddd !important; box-shadow: none !important; }
      .schedule-table th, .schedule-table td { color: black !important; }
      .schedule-table tbody tr:hover { background: none !important; }
      #output { page-break-inside: avoid; }

      /* reveal list view columns in print */
      .col-check, .col-notes { display: table-cell; }
      .col-check { width: 2rem; text-align: center; }
      .col-notes { width: 30%; }
      td.col-notes { border-bottom: 1px solid var(--border) !important; }
      .schedule-table tbody tr:last-child td.col-notes { border-bottom: none !important; }
      .schedule-check { accent-color: unset; }

      /* reveal calendar print-only elements */
      .cal-print-check {
        display: block;
        margin-top: 0.2rem;
      }
      .cal-print-check input {
        width: 0.75rem;
        height: 0.75rem;
        accent-color: unset;
      }
      .cal-notes-row { display: table-row; }
      .cal-notes-cell {
        height: 1.5rem;
        border-bottom: 1px solid var(--border) !important;
      }
      .cal-table tbody tr:last-of-type .cal-notes-cell { border-bottom: none !important; }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="no-print sticky top-0 z-10 border-b" style="background: var(--surface); border-color: var(--border);">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Tool nav (future tools slot in here) -->
      <nav class="flex items-center gap-2">
        <span class="font-semibold text-sm" style="color: var(--accent);">Utility Tools</span>
        <span style="color: var(--border);">|</span>
        <span class="text-sm font-medium" style="color: var(--text);">Study Scheduler</span>
        <!-- FUTURE TOOLS: add <a> links here for each new tool page -->
      </nav>

      <!-- Theme switcher -->
      <div class="flex items-center gap-1.5">
        <button class="theme-btn" data-theme="pastel">Pastel</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
      </div>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">

    <!-- Title -->
    <div class="no-print">
      <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text);">Study Schedule Generator</h1>
      <p class="mt-1 text-sm" style="color: var(--text-muted);">
        Enter your exam details and get a day-by-day study plan.
      </p>
    </div>

    <!-- ── Input form ─────────────────────────────────────── -->
    <section class="card p-5 space-y-4 no-print">

      <!-- Mode toggle -->
      <div>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="fill">Fill my schedule</button>
          <button class="mode-btn" data-mode="target">Hit a target</button>
        </div>
        <p id="modeHint" class="mt-2 text-xs" style="color: var(--text-muted);">
          Fills every available day up to your daily limit.
        </p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div class="space-y-1.5">
          <label for="examDate">Exam Date</label>
          <input id="examDate" type="date" class="field" />
        </div>

        <!-- Only shown in "target" mode -->
        <div class="space-y-1.5" id="totalHoursField" style="display:none;">
          <label for="totalHours">Total Study Hours</label>
          <input id="totalHours" type="number" min="1" step="0.5" placeholder="e.g. 40" class="field" />
        </div>

        <div class="space-y-1.5">
          <label for="maxHours">Hours Per Day</label>
          <input id="maxHours" type="number" min="0.5" max="24" step="0.5" placeholder="e.g. 4" class="field" />
        </div>

        <div class="space-y-1.5">
          <label for="restDays">Rest Days Per Week <span style="font-weight:400;">(optional)</span></label>
          <input id="restDays" type="number" min="0" max="6" step="1" placeholder="e.g. 1" class="field" value="0" />
        </div>

      </div>

      <!-- Error message -->
      <div id="errorMsg" class="hidden"></div>

      <button id="generateBtn" class="btn-primary w-full sm:w-auto">Generate Schedule</button>
    </section>

    <!-- ── Output ─────────────────────────────────────────── -->
    <section>

      <div id="output" class="card p-5 space-y-2" style="display:none;"></div>

      <!-- Export actions -->
      <div id="exportActions" class="hidden no-print flex flex-wrap gap-2 mt-3">
        <button id="printBtn" class="btn-secondary">Print / Save PDF</button>
        <button id="copyNotionBtn" class="btn-secondary">Copy for Notion</button>
        <button id="copyRawBtn" class="btn-secondary">Copy Raw Text</button>
        <button id="calExportBtn" class="btn-secondary">Export to Calendar</button>
      </div>

      <!-- Calendar export panel -->
      <div id="calExportPanel" class="hidden no-print card p-4 mt-3">
        <div class="flex items-center justify-between mb-3">
          <span class="font-semibold text-sm" style="color:var(--text);">Export to Calendar (.ics)</span>
          <button id="calExportClose" style="background:none;border:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:0.1rem 0.3rem;color:var(--text-muted);">✕</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div class="space-y-1.5">
            <label for="calEventName">Event Name</label>
            <input id="calEventName" type="text" class="field" value="Study Session" placeholder="Study Session" />
          </div>
          <div class="space-y-1.5">
            <label for="calStartTime">Start Time</label>
            <input id="calStartTime" type="time" class="field" value="09:00" />
          </div>
        </div>
        <button id="calDownloadBtn" class="btn-primary">Download .ics</button>
      </div>

    </section>

  </main>

  <script src="js/app.js"></script>
  <script>
    // Show output card once content is rendered
    const outputEl = document.getElementById('output');
    const observer = new MutationObserver(() => {
      outputEl.style.display = outputEl.innerHTML.trim() ? 'block' : 'none';
    });
    observer.observe(outputEl, { childList: true });
  </script>
</body>
</html>
