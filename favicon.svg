<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#fff1f5"/>
  <!-- Calendar body -->
  <rect x="6" y="9" width="20" height="17" rx="2.5" fill="#ec4899"/>
  <!-- Calendar top bar -->
  <rect x="6" y="9" width="20" height="6" rx="2.5" fill="#be185d"/>
  <!-- Corner fix: bottom of top bar is flat -->
  <rect x="6" y="12" width="20" height="3" fill="#be185d"/>
  <!-- Ring left -->
  <rect x="10" y="6" width="3" height="6" rx="1.5" fill="#be185d"/>
  <!-- Ring right -->
  <rect x="19" y="6" width="3" height="6" rx="1.5" fill="#be185d"/>
  <!-- Grid dots -->
  <rect x="10" y="19" width="3" height="3" rx="0.75" fill="#fff1f5"/>
  <rect x="14.5" y="19" width="3" height="3" rx="0.75" fill="#fff1f5"/>
  <rect x="19" y="19" width="3" height="3" rx="0.75" fill="#fff1f5"/>
  <rect x="10" y="22.5" width="3" height="1.5" rx="0.5" fill="#fbcfe8"/>
  <rect x="14.5" y="22.5" width="3" height="1.5" rx="0.5" fill="#fbcfe8"/>
</svg>
